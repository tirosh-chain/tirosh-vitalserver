[project]
name = "tirosh-vitalserver-redis-relay"
version = "0.2.0"
description = "VitalServer Redis Relay Protocol v1 publisher for allowlisted source Redis keys."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vitalserver-redis-relay = "vitalserver_redis_relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitalserver_redis_relay"]
only-include = ["vitalserver_redis_relay"]

[tool.hatch.build.targets.sdist]
include = [
  "/vitalserver_redis_relay",
  "/pyproject.toml",
  "/README.md",
  "/packaging",
]
