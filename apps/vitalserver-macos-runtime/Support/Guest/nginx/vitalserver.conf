map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

log_format vitalserver_json escape=json
  '{"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"remote_port":"$remote_port",'
  '"request_uri":"$request_uri",'
  '"status":"$status",'
  '"upstream_status":"$upstream_status",'
  '"upstream_response_time":"$upstream_response_time",'
  '"http_upgrade":"$http_upgrade"}';

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log /var/log/vitalserver-edge/access.jsonl vitalserver_json;

  set $vitalserver_app audit-proxy:8080;
  set $vitaldb_observer vitaldb-observer:8080;
  set $redis_ui redis-ui:8081;
  set $swagger_ui swagger-ui:8080;

  location = /health {
    access_log off;
    default_type text/plain;
    return 204;
  }

  location = /ready {
    proxy_pass http://$vitalserver_app/check;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://$vitalserver_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/observations {
    proxy_pass http://$vitaldb_observer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /redis-ui {
    return 301 /redis-ui/;
  }

  location /redis-ui/ {
    rewrite ^/redis-ui/(.*)$ /$1 break;
    proxy_pass http://$redis_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /redis-ui;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /swagger {
    return 301 /swagger/;
  }

  location /swagger/ {
    proxy_pass http://$swagger_ui;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$vitalserver_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
