services:
  postgres:
    image: postgres:16-alpine
    security_opt:
      - seccomp=unconfined
    environment:
      POSTGRES_DB: vitalserver
      POSTGRES_USER: vitalserver
      POSTGRES_PASSWORD: "${VITALSERVER_POSTGRES_PASSWORD:-vitalserver}"
    expose:
      - "5432"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalserver -d vitalserver"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:3.2.12-alpine
    security_opt:
      - seccomp=unconfined
    command:
      - sh
      - -c
      - |
        if [ -f /data/appendonly.aof ]; then
          redis-check-aof /data/appendonly.aof >/tmp/redis-aof-check.log 2>&1 || {
            cp /data/appendonly.aof "/data/appendonly.aof.bak.$(date +%Y%m%d%H%M%S)" || true
            printf 'y\n' | redis-check-aof --fix /data/appendonly.aof
          }
        fi
        exec redis-server --appendonly yes --bind 0.0.0.0 --protected-mode no
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: apps/vitalserver/docker/Dockerfile
    image: vitalserver:2.3.4
    security_opt:
      - seccomp=unconfined
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "80"
    environment:
      VITALSERVER_ADMIN_PASSWORD: "${VITALSERVER_ADMIN_PASSWORD:-admin}"
      VITALSERVER_MIN_CPUS: "8"
      VITALSERVER_PUBLIC_HOST: "${VITALSERVER_PUBLIC_HOST:-}"
      VITALSERVER_PUBLIC_PORT: "${VITALSERVER_PUBLIC_PORT:-}"
      VITALSERVER_REDIS_HOST: "${VITALSERVER_REDIS_HOST:-redis}"
      VITALSERVER_REDIS_PORT: "${VITALSERVER_REDIS_PORT:-6379}"
      VITALSERVER_TRUST_PROXY: "${VITALSERVER_TRUST_PROXY:-1}"
    command:
      - sh
      - -c
      - |
        node -e '
        const net = require("net");
        const host = process.env.VITALSERVER_REDIS_HOST || "redis";
        const port = Number(process.env.VITALSERVER_REDIS_PORT || 6379);
        const deadline = Date.now() + 120000;
        function wait() {
          const socket = net.createConnection({ host, port });
          socket.setTimeout(3000);
          socket.on("connect", () => {
            socket.end();
            process.exit(0);
          });
          socket.on("error", retry);
          socket.on("timeout", () => {
            socket.destroy();
            retry();
          });
        }
        function retry() {
          if (Date.now() > deadline) {
            console.error("redis is not reachable: " + host + ":" + port);
            process.exit(1);
          }
          setTimeout(wait, 1000);
        }
        wait();
        ' && exec node service/app.js
    volumes:
      - type: bind
        source: ${VITALSERVER_VITAL_FILES_DIR:-/mnt/tirosh-vital-files}
        target: /opt/vitalserver/vital_files
      - type: bind
        source: ${VITALSERVER_VR_RELEASE_DIR:-/mnt/tirosh/vr-release}
        target: /opt/vitalserver/service/vr_release
      - type: volume
        source: vital-tmp-files
        target: /opt/vitalserver/service/tmp_files
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1/check', r => process.exit(r.statusCode >= 200 && r.statusCode < 300 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  recorder-recovery:
    build:
      context: .
      dockerfile: apps/vitalserver-recorder-recovery/Dockerfile
    image: vitalserver-recorder-recovery:0.2.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${VITALSERVER_RECORDER_INGRESS_RAW_DIR:-/mnt/tirosh/run/recorder-ingress-raw}
        target: /var/lib/vitalserver-recorder-ingress/raw
      - type: bind
        source: ${VITALSERVER_RECORDER_INGRESS_RECOVERY_DIR:-/mnt/tirosh/run/recorder-ingress-recovery}
        target: /var/lib/vitalserver-recorder-ingress/recovery
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  recorder-ingress:
    build:
      context: .
      dockerfile: apps/vitalserver-recorder-ingress/Dockerfile
    image: vitalserver-recorder-ingress:0.2.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      app:
        condition: service_healthy
      recorder-recovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8080"
    environment:
      RECORDER_INGRESS_UPSTREAM_HOST: app
      RECORDER_INGRESS_UPSTREAM_PORT: "80"
      VITALSERVER_REDIS_HOST: "${VITALSERVER_REDIS_HOST:-redis}"
      VITALSERVER_REDIS_PORT: "${VITALSERVER_REDIS_PORT:-6379}"
      RECORDER_INGRESS_REDIS_TIMEOUT_MS: "${RECORDER_INGRESS_REDIS_TIMEOUT_MS:-1500}"
      RECORDER_INGRESS_REDIS_MAX_QUEUE_LENGTH: "${RECORDER_INGRESS_REDIS_MAX_QUEUE_LENGTH:-50000}"
      RECORDER_INGRESS_REDIS_RETRY_MAX_ATTEMPTS: "${RECORDER_INGRESS_REDIS_RETRY_MAX_ATTEMPTS:-3}"
      RECORDER_INGRESS_REDIS_RETRY_BASE_DELAY_MS: "${RECORDER_INGRESS_REDIS_RETRY_BASE_DELAY_MS:-25}"
      RECORDER_INGRESS_REDIS_RETRY_MAX_DELAY_MS: "${RECORDER_INGRESS_REDIS_RETRY_MAX_DELAY_MS:-500}"
      RECORDER_INGRESS_REDIS_RETRY_JITTER_RATIO: "${RECORDER_INGRESS_REDIS_RETRY_JITTER_RATIO:-0.2}"
      VITALSERVER_TRUST_PROXY: "${VITALSERVER_TRUST_PROXY:-1}"
      VITALSERVER_AUDIT_ENABLED: "${VITALSERVER_AUDIT_ENABLED:-1}"
      VITALSERVER_AUDIT_REDIS_LIST: "${VITALSERVER_AUDIT_REDIS_LIST:-vitalserver:audit_events}"
      VITALSERVER_AUDIT_REDIS_MAXLEN: "${VITALSERVER_AUDIT_REDIS_MAXLEN:-10000}"
      VITALSERVER_AUDIT_FILE_ENABLED: "${VITALSERVER_AUDIT_FILE_ENABLED:-1}"
      VITALSERVER_AUDIT_LOG_PATH: "${VITALSERVER_AUDIT_LOG_PATH:-/var/log/vitalserver-audit/audit-events.log}"
      VITALSERVER_AUDIT_LOG_FORMAT: "${VITALSERVER_AUDIT_LOG_FORMAT:-json}"
      VITALSERVER_AUDIT_STDOUT_ENABLED: "${VITALSERVER_AUDIT_STDOUT_ENABLED:-1}"
      VITALSERVER_AUDIT_STDOUT_FORMAT: "${VITALSERVER_AUDIT_STDOUT_FORMAT:-json}"
      RECORDER_INGRESS_FAILURE_LOG_ENABLED: "${RECORDER_INGRESS_FAILURE_LOG_ENABLED:-1}"
      RECORDER_INGRESS_FAILURE_LOG_PATH: "${RECORDER_INGRESS_FAILURE_LOG_PATH:-/var/log/vitalserver-recorder-ingress/failures/send-data-failures.jsonl}"
      RECORDER_INGRESS_RAW_ARCHIVE_ENABLED: "${RECORDER_INGRESS_RAW_ARCHIVE_ENABLED:-1}"
      RECORDER_INGRESS_RAW_ARCHIVE_PATH: "${RECORDER_INGRESS_RAW_ARCHIVE_PATH:-/var/lib/vitalserver-recorder-ingress/raw/send-data-raw.jsonl}"
      RECORDER_INGRESS_RAW_ARCHIVE_MAX_FILE_BYTES: "${RECORDER_INGRESS_RAW_ARCHIVE_MAX_FILE_BYTES:-536870912}"
      RECORDER_INGRESS_RAW_ARCHIVE_MAX_FILES: "${RECORDER_INGRESS_RAW_ARCHIVE_MAX_FILES:-24}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_ENABLED: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_ENABLED:-1}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_QUIET_MS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_QUIET_MS:-300000}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_SCAN_INTERVAL_MS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_SCAN_INTERVAL_MS:-60000}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_CURSOR_STABLE_MS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_CURSOR_STABLE_MS:-60000}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_RETRY_DELAY_MS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_RETRY_DELAY_MS:-60000}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_MAX_ATTEMPTS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_MAX_ATTEMPTS:-3}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_REQUEST_TIMEOUT_MS: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_REQUEST_TIMEOUT_MS:-300000}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_RECOVER_URL: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_RECOVER_URL:-http://recorder-recovery:8080/raw-archive/recover-vital}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_VITALSERVER_URL: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_VITALSERVER_URL:-http://app:80}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_UPLOAD_ENDPOINT: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_UPLOAD_ENDPOINT:-/upload}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_OUTPUT_DIR: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_OUTPUT_DIR:-/var/lib/vitalserver-recorder-ingress/recovery/vital-export}"
      RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_STATE_PATH: "${RECORDER_INGRESS_RAW_ARCHIVE_AUTO_EXPORT_STATE_PATH:-/var/lib/vitalserver-recorder-ingress/recovery/raw-archive-auto-export-state.json}"
      RECORDER_INGRESS_UPSTREAM_TIMEOUT_MS: "${RECORDER_INGRESS_UPSTREAM_TIMEOUT_MS:-3600000}"
      RECORDER_INGRESS_SEND_DATA_MODE: "${RECORDER_INGRESS_SEND_DATA_MODE:-spool_and_replay}"
      RECORDER_INGRESS_SEND_DATA_REDIS_LIST: "${RECORDER_INGRESS_SEND_DATA_REDIS_LIST:-vitalserver:recorder_ingress:send_data:pending}"
      RECORDER_INGRESS_SEND_DATA_IN_FLIGHT_REDIS_LIST: "${RECORDER_INGRESS_SEND_DATA_IN_FLIGHT_REDIS_LIST:-vitalserver:recorder_ingress:send_data:in_flight}"
      RECORDER_INGRESS_SEND_DATA_REPLAYED_REDIS_LIST: "${RECORDER_INGRESS_SEND_DATA_REPLAYED_REDIS_LIST:-vitalserver:recorder_ingress:send_data:replayed}"
      RECORDER_INGRESS_SEND_DATA_DEAD_LETTER_REDIS_LIST: "${RECORDER_INGRESS_SEND_DATA_DEAD_LETTER_REDIS_LIST:-vitalserver:recorder_ingress:send_data:dead_letter}"
      RECORDER_INGRESS_SEND_DATA_REPLAYED_MAX_ITEMS: "${RECORDER_INGRESS_SEND_DATA_REPLAYED_MAX_ITEMS:-10000}"
      RECORDER_INGRESS_SEND_DATA_REALTIME_MAX_PENDING_ITEMS: "${RECORDER_INGRESS_SEND_DATA_REALTIME_MAX_PENDING_ITEMS:-2000}"
      RECORDER_INGRESS_SEND_DATA_MAX_PENDING_ITEMS: "${RECORDER_INGRESS_SEND_DATA_MAX_PENDING_ITEMS:-100000}"
      RECORDER_INGRESS_SEND_DATA_MAX_PENDING_BYTES: "${RECORDER_INGRESS_SEND_DATA_MAX_PENDING_BYTES:-536870912}"
      RECORDER_INGRESS_SEND_DATA_MAX_PAYLOAD_BYTES: "${RECORDER_INGRESS_SEND_DATA_MAX_PAYLOAD_BYTES:-10485760}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_ENABLED: "${RECORDER_INGRESS_SEND_DATA_REPLAY_ENABLED:-}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_INTERVAL_MS: "${RECORDER_INGRESS_SEND_DATA_REPLAY_INTERVAL_MS:-1000}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_BATCH_SIZE: "${RECORDER_INGRESS_SEND_DATA_REPLAY_BATCH_SIZE:-1000}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_MAX_ATTEMPTS: "${RECORDER_INGRESS_SEND_DATA_REPLAY_MAX_ATTEMPTS:-3}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_MAX_BYTES_PER_SECOND: "${RECORDER_INGRESS_SEND_DATA_REPLAY_MAX_BYTES_PER_SECOND:-20971520}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_ADAPTIVE_MIN_CONCURRENCY: "${RECORDER_INGRESS_SEND_DATA_REPLAY_ADAPTIVE_MIN_CONCURRENCY:-1}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_ADAPTIVE_MAX_CONCURRENCY: "${RECORDER_INGRESS_SEND_DATA_REPLAY_ADAPTIVE_MAX_CONCURRENCY:-8}"
      RECORDER_INGRESS_SEND_DATA_REPLAY_TARGET_TIMEOUT_MS: "${RECORDER_INGRESS_SEND_DATA_REPLAY_TARGET_TIMEOUT_MS:-5000}"
    volumes:
      - type: volume
        source: audit-logs
        target: /var/log/vitalserver-audit
      - type: bind
        source: ${VITALSERVER_RECORDER_INGRESS_FAILURES_DIR:-/mnt/tirosh/run/recorder-ingress-failures}
        target: /var/log/vitalserver-recorder-ingress/failures
      - type: bind
        source: ${VITALSERVER_RECORDER_INGRESS_RAW_DIR:-/mnt/tirosh/run/recorder-ingress-raw}
        target: /var/lib/vitalserver-recorder-ingress/raw
      - type: bind
        source: ${VITALSERVER_RECORDER_INGRESS_RECOVERY_DIR:-/mnt/tirosh/run/recorder-ingress-recovery}
        target: /var/lib/vitalserver-recorder-ingress/recovery
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8080/recorder-ingress/health', r => process.exit(r.statusCode === 204 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  vitaldb-observer:
    build:
      context: .
      dockerfile: apps/vitaldb-observer/Dockerfile
    image: vitaldb-observer:0.2.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      redis:
        condition: service_healthy
      recorder-ingress:
        condition: service_healthy
    ports:
      - "127.0.0.1:18084:8080"
    environment:
      VITALDB_OBSERVER_HOST: "${VITALDB_OBSERVER_HOST:-0.0.0.0}"
      VITALDB_OBSERVER_REDIS_HOST: "${VITALDB_OBSERVER_REDIS_HOST:-redis}"
      VITALDB_OBSERVER_REDIS_PORT: "${VITALDB_OBSERVER_REDIS_PORT:-6379}"
      VITALDB_OBSERVER_RECORDER_ONLINE_THRESHOLD_SECONDS: "${VITALDB_OBSERVER_RECORDER_ONLINE_THRESHOLD_SECONDS:-120}"
      VITALDB_OBSERVER_ACCESS_LOG_PATH: "${VITALDB_OBSERVER_ACCESS_LOG_PATH:-/var/log/vitalserver-edge/access.jsonl}"
    volumes:
      - type: volume
        source: edge-logs
        target: /var/log/vitalserver-edge
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-relay:
    build:
      context: .
      dockerfile: apps/vitalserver-redis-relay/Dockerfile
    image: vitalserver-redis-relay:0.2.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_RELAY_CONFIG_PATH: "${REDIS_RELAY_CONFIG_PATH:-/run/tirosh/config/redis-relay.toml}"
      REDIS_RELAY_STATUS_PATH: "${REDIS_RELAY_STATUS_PATH:-/run/tirosh/status/redis-relay-status.json}"
      REDIS_RELAY_STATUS_OWNER_SOCKET: "${REDIS_RELAY_STATUS_OWNER_SOCKET:-}"
      REDIS_RELAY_STATUS_OWNER_URL: "${REDIS_RELAY_STATUS_OWNER_URL-http://host.docker.internal:18330/runtime/redis-relay/status}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${VITALSERVER_REDIS_RELAY_CONFIG_DIR:-/mnt/tirosh/deploy/redis-relay-config}
        target: /run/tirosh/config
        read_only: true
      - type: bind
        source: ${VITALSERVER_REDIS_RELAY_SECRETS_DIR:-/mnt/tirosh/deploy/redis-relay-secrets}
        target: /run/tirosh/secrets
        read_only: true
      - type: bind
        source: ${VITALSERVER_REDIS_RELAY_STATUS_DIR:-/mnt/tirosh/run/redis-relay-status}
        target: /run/tirosh/status
      - type: bind
        source: ${VITALSERVER_RUNTIME_RUN_DIR:-/mnt/tirosh/run}
        target: /run/tirosh/status-owner
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys; socket=os.environ.get('REDIS_RELAY_STATUS_OWNER_SOCKET'); url=os.environ.get('REDIS_RELAY_STATUS_OWNER_URL'); sys.exit(0 if (socket and os.path.exists(socket)) or url else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  lab:
    build:
      context: .
      dockerfile: apps/vitalserver-lab/Dockerfile
    image: vitalserver-lab:0.2.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - type: bind
        source: ${VITALSERVER_VITAL_FILES_DIR:-/mnt/tirosh-vital-files}
        target: /mnt/tirosh-vital-files
        read_only: true
    environment:
      VITALSERVER_LAB_HOST: "${VITALSERVER_LAB_HOST:-0.0.0.0}"
      VITALSERVER_LAB_PORT: "${VITALSERVER_LAB_PORT:-8080}"
      VITALSERVER_LAB_SERVICE_NAME: "${VITALSERVER_LAB_SERVICE_NAME:-vitalserver-lab}"
      VITALSERVER_LAB_SESSION_STORE: "postgres"
      VITALSERVER_LAB_DATABASE_URL: "postgresql://vitalserver@postgres:5432/vitalserver"
      VITALSERVER_LAB_VITAL_FILES_MOUNT: "/mnt/tirosh-vital-files"
      PGPASSWORD: "${VITALSERVER_POSTGRES_PASSWORD:-vitalserver}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-ui:
    image: ghcr.io/joeferner/redis-commander:0.9.0
    security_opt:
      - seccomp=unconfined
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8081/', r => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    security_opt:
      - seccomp=unconfined
    expose:
      - "8080"
    environment:
      BASE_URL: "/swagger"
      URLS: >-
        [
          {"name":"VitalServer","url":"/swagger/docs/openapi.yaml"},
          {"name":"Runtime Control API","url":"/swagger/docs/macos-runtime/runtime-control.openapi.json"},
          {"name":"Recorder Ingress","url":"/swagger/docs/openapi/recorder-ingress.openapi.yaml"},
          {"name":"VitalDB Observer","url":"/swagger/docs/openapi/vitaldb-observer.openapi.yaml"}
        ]
      URLS_PRIMARY_NAME: "VitalServer"
    volumes:
      - type: bind
        source: ${VITALSERVER_DOCS_DIR:-/mnt/tirosh/deploy/docs}
        target: /usr/share/nginx/html/docs
        read_only: true
      - type: bind
        source: ${VITALSERVER_OPENAPI_PATH:-/mnt/tirosh/deploy/docs/openapi.yaml}
        target: /usr/share/nginx/html/openapi.yaml
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/swagger/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  edge:
    image: nginx:1.24-alpine
    security_opt:
      - seccomp=unconfined
    depends_on:
      recorder-ingress:
        condition: service_healthy
      redis-ui:
        condition: service_healthy
      swagger-ui:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ${VITALSERVER_NGINX_CONFIG_PATH:-/mnt/tirosh/deploy/nginx/vitalserver.conf}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: edge-logs
        target: /var/log/vitalserver-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  vital-tmp-files:
  audit-logs:
  edge-logs:
