[project]
name = "tirosh-vitaldb-observer"
version = "0.2.0"
description = "VitalDB local observer for Redis and proxy access-log snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vitaldb-observer = "vitaldb_observer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitaldb_observer"]
only-include = ["vitaldb_observer"]

[tool.hatch.build.targets.sdist]
include = [
  "/vitaldb_observer",
  "/pyproject.toml",
  "/README.md",
  "/packaging",
]
