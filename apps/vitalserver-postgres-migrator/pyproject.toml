[project]
name = "tirosh-vitalserver-postgres-migrator"
version = "0.2.0"
description = "Single PostgreSQL schema lifecycle owner for VitalServer."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
]

[project.scripts]
vitalserver-postgres-migrate = "vitalserver_postgres_migrator.cli:main"
vitalserver-postgres-inventory = "vitalserver_postgres_migrator.inventory_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalserver_postgres_migrator"]
