site_name: Vital Server Helper
site_url: https://tirosh-chain.github.io/vitalserver-helper/
repo_url: https://github.com/tirosh-chain/tirosh-vitalserver
repo_name: tirosh-chain/tirosh-vitalserver
docs_dir: site-docs
site_dir: site

theme:
  name: readthedocs
  navigation_depth: 3

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Release:
      - Overview: release/index.md
      - Release Notes: release/changelog.md
      - Usage: release/usage.md
      - Clean Uninstall: release/clean-uninstall.md
      - Reset Installer: release/reset-installer.md
      - Support Scope: release/scope.md
      - Runtime Status: release/runtime-status.md
      - Observability Events: release/observability-events.md
  - Dev:
      - Overview: dev/index.md
      - Architecture: dev/architecture.md
      - Runtime Contracts: dev/runtime-contracts.md
      - Backup/Restore 계약: dev/backup-restore-contracts.md
      - Repository Map: dev/repository-map.md
      - Delivery & Validation: dev/delivery-validation.md
