site_name: Vital Server Helper
site_url: https://tirosh-chain.github.io/vitalserver-helper/
repo_url: https://github.com/tirosh-chain/tirosh-vitalserver
repo_name: tirosh-chain/tirosh-vitalserver
docs_dir: site-docs
site_dir: site

theme:
  name: mkdocs

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Release:
      - Overview: release/index.md
      - Usage: release/usage.md
      - Capabilities: release/scope.md
      - Status Reference: release/runtime-status.md
  - Dev:
      - Overview: dev/index.md
      - Architecture: dev/architecture.md
      - Runtime Model: dev/health-check-contract.md
      - Service Catalog: dev/service-catalog.md
      - Package Map: dev/package-map.md
      - Mac Hardware Profile: dev/mac-hardware-profile.md
      - API Reference: dev/api-contracts.md
      - Build and Release: dev/build-and-release.md
      - Testing: dev/testing.md
      - Troubleshooting: dev/troubleshooting.md
      - Repository Workflow: dev/github-issues.md
