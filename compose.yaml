services:
  redis:
    image: redis:3.2.12-alpine
    platform: linux/amd64
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/vitalserver/docker/Dockerfile
    image: vitalserver:2.3.4
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "80"
    environment:
      VITALSERVER_ADMIN_PASSWORD: "${VITALSERVER_ADMIN_PASSWORD:-admin}"
      VITALSERVER_MIN_CPUS: "8"
      VITALSERVER_PUBLIC_HOST: "${VITALSERVER_PUBLIC_HOST:-}"
      VITALSERVER_PUBLIC_PORT: "${VITALSERVER_PUBLIC_PORT:-}"
      VITALSERVER_REDIS_HOST: "${VITALSERVER_REDIS_HOST:-redis}"
      VITALSERVER_REDIS_PORT: "${VITALSERVER_REDIS_PORT:-6379}"
      VITALSERVER_TRUST_PROXY: "${VITALSERVER_TRUST_PROXY:-0}"
    volumes:
      - type: volume
        source: vital-files
        target: /opt/vitalserver/vital_files
      - type: volume
        source: vital-vr-release
        target: /opt/vitalserver/service/vr_release
      - type: volume
        source: vital-tmp-files
        target: /opt/vitalserver/service/tmp_files
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1/check', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  audit-proxy:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/vitalserver-audit-proxy/Dockerfile
    image: vitalserver-audit-proxy:0.1.0
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${VITALSERVER_BIND_HOST:-127.0.0.1}:${VITALSERVER_HTTP_PORT:-18080}:8080"
    environment:
      AUDIT_PROXY_UPSTREAM_HOST: app
      AUDIT_PROXY_UPSTREAM_PORT: "80"
      VITALSERVER_REDIS_HOST: "${VITALSERVER_REDIS_HOST:-redis}"
      VITALSERVER_REDIS_PORT: "${VITALSERVER_REDIS_PORT:-6379}"
      VITALSERVER_TRUST_PROXY: "${VITALSERVER_TRUST_PROXY:-0}"
      VITALSERVER_AUDIT_ENABLED: "${VITALSERVER_AUDIT_ENABLED:-1}"
      VITALSERVER_AUDIT_REDIS_LIST: "${VITALSERVER_AUDIT_REDIS_LIST:-vitalserver:audit_events}"
      VITALSERVER_AUDIT_REDIS_MAXLEN: "${VITALSERVER_AUDIT_REDIS_MAXLEN:-10000}"
      VITALSERVER_AUDIT_FILE_ENABLED: "${VITALSERVER_AUDIT_FILE_ENABLED:-1}"
      VITALSERVER_AUDIT_LOG_PATH: "${VITALSERVER_AUDIT_LOG_PATH:-/var/log/vitalserver-audit/audit-events.log}"
      VITALSERVER_AUDIT_LOG_FORMAT: "${VITALSERVER_AUDIT_LOG_FORMAT:-json}"
      VITALSERVER_AUDIT_STDOUT_ENABLED: "${VITALSERVER_AUDIT_STDOUT_ENABLED:-1}"
      VITALSERVER_AUDIT_STDOUT_FORMAT: "${VITALSERVER_AUDIT_STDOUT_FORMAT:-json}"
      AUDIT_PROXY_UPSTREAM_TIMEOUT_MS: "${AUDIT_PROXY_UPSTREAM_TIMEOUT_MS:-30000}"
    volumes:
      - type: volume
        source: audit-logs
        target: /var/log/vitalserver-audit
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8080/audit-proxy/health', r => process.exit(r.statusCode === 204 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis-ui:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles:
      - swagger
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      URL: /openapi.yaml
    ports:
      - "${SWAGGER_UI_PORT:-8082}:8080"
    volumes:
      - type: bind
        source: ./docs/openapi.yaml
        target: /usr/share/nginx/html/openapi.yaml
        read_only: true
      - type: bind
        source: ./infra/swagger-ui/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
    restart: unless-stopped

volumes:
  redis-data:
  vital-files:
  vital-vr-release:
  vital-tmp-files:
  audit-logs:
