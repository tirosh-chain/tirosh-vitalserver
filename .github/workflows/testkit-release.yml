name: Testkit Release

on:
  push:
    tags:
      - "testkit-v*"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and upload even when testkit files did not change."
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  changes:
    name: Detect testkit changes
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package changes since previous tag
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_ref="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-creatordate | grep '^testkit-v' | grep -v "^${current_ref}$" | head -n 1 || true)"

          if [ -z "$previous_tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${previous_tag}" HEAD -- \
            .github/workflows/testkit-release.yml \
            config/testkit.toml \
            make/python.mk \
            packages/vitalserver-testkit \
            pyproject.toml \
            scripts \
            uv.lock)"

          if [ -n "$changed_files" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.should_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install workspace
        run: uv sync --all-groups

      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/testkit-v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("packages/vitalserver-testkit/pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#testkit-v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "package version ${package_version} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Lint
        run: uv run ruff check packages/vitalserver-testkit/src packages/vitalserver-testkit/tests scripts

      - name: Typecheck
        run: uv run mypy packages/vitalserver-testkit scripts

      - name: Test
        run: uv run pytest packages/vitalserver-testkit/tests

      - name: Build package
        run: uv build --out-dir packages/vitalserver-testkit/dist --clear packages/vitalserver-testkit

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/testkit-v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#testkit-v}"
          cat > packages/vitalserver-testkit/dist/release-notes.md <<EOF
          ## vitalserver-testkit ${version}

          이 release는 monorepo 전체가 아니라 \`packages/vitalserver-testkit\` Python package만 대상으로 합니다.

          ## Assets
          - Wheel: \`tirosh_vitalserver_testkit-${version}-py3-none-any.whl\`
          - Source distribution: \`tirosh_vitalserver_testkit-${version}.tar.gz\`

          ## Install
          \`\`\`sh
          uv pip install ./tirosh_vitalserver_testkit-${version}-py3-none-any.whl
          \`\`\`
          EOF

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/testkit-v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packages/vitalserver-testkit/dist/release-notes.md
          files: |
            packages/vitalserver-testkit/dist/*.whl
            packages/vitalserver-testkit/dist/*.tar.gz
