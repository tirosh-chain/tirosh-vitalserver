# Build-machine settings for local VM artifact preparation.
# This file is not installed as product runtime config.

[workspace]
macos_runtime_source_dir = "apps/vitalserver-macos-runtime"
build_dir = ".tmp/vitalserver-vm-pkg"
dist_dir = "dist"
clang_module_cache = ".tmp/clang-module-cache"

[macos.app]
name = "VitalServer Helper"
helper_product_name = "VitalServerHelper"
runtime_cli_product_name = "vitalserver-vm"
bundle_dir = ".tmp/VitalServer Helper.app"

[macos.package]
identifier = "ai.tirosh.vitalserver.helper"

# Filesystem contract for files laid down by the macOS installer.
[macos.install]
product_root = "/Library/Application Support/VitalServerHelper"
applications_dir = "/Applications"
launch_daemons_dir = "/Library/LaunchDaemons"
vm_cli = "/usr/local/bin/vitalserver-vm"
proxy_runner = "/usr/local/bin/vitalserver-proxy-run"
uninstaller = "/usr/local/bin/tirosh-vitalserver-uninstall"
install_settings_json = "/private/tmp/tirosh-vitalserver-install.json"
uninstall_log = "/private/tmp/tirosh-vitalserver-uninstall.log"
preserve_tmp_template = "/private/tmp/tirosh-vitalserver-preserve.XXXXXX"

[macos.package.outputs]
pkg_filename_template = "VitalServerHelper-{releaseLabel}.pkg"
dmg_filename_template = "VitalServerHelper-{releaseLabel}.dmg"
dmg_installer_pkg_name = "Install VitalServer Helper.pkg"
dmg_staging_dir = ".tmp/vitalserver-vm-dmg"

[macos.launchd.vm]
template_file = "ai.tirosh.vitalserver.helper.vm.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.vm.plist"

[macos.launchd.proxy]
template_file = "ai.tirosh.vitalserver.helper.proxy.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.proxy.plist"

[macos.launchd.guest_log_sync]
template_file = "ai.tirosh.vitalserver.helper.guest-log-sync.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.guest-log-sync.plist"

[macos.launchd.sleep_prevention]
template_file = "ai.tirosh.vitalserver.helper.sleep-prevention.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.sleep-prevention.plist"

[macos.launchd.watchdog]
template_file = "ai.tirosh.vitalserver.helper.watchdog.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.watchdog.plist"

[macos.launchd.automatic_backup]
template_file = "ai.tirosh.vitalserver.helper.automatic-backup.plist.template"
installed_plist = "ai.tirosh.vitalserver.helper.automatic-backup.plist"

[macos.host_proxy.nginx]
binary_path = ".artifacts/nginx/macos/bin/nginx"
source_binary_path = "/opt/homebrew/opt/nginx/bin/nginx"
non_system_dylib_prefixes = ["/opt/", "/usr/local/"]

[guest.ubuntu]
release = "noble"
version = "24.04"
base_url = "https://cloud-images.ubuntu.com/releases/noble/release-20250516"
apt_snapshot = "20250515T000000Z"
arch = "auto"
kernel_suffix = "vmlinuz-generic"
initrd_suffix = "initrd-generic"

[guest.runtime]
disk_image_name = "vm-disk.img"
rootfs_size = "8G"
runtime_dir = "~/.tirosh/vitalserver-vm/runtime"

[guest.runtime_data]
disk_image_name = "runtime-data.img"
disk_size = "16G"
filesystem_label = "vital-runtime"
mount_path = "/mnt/runtime"
docker_data_root = "/mnt/runtime/docker"
containerd_root = "/mnt/runtime/containerd"

[guest.cloud_init]
seed_directory_name = "cloud-init-seed"
seed_iso_name = "seed.iso"
hostname = "tirosh-vitalserver"
username = "tirosh"
password = "tirosh"
ssh_key_path = "~/.ssh/id_ed25519.pub"
run_bootstrap = true
share_tag = "tirosh"
share_mount = "/mnt/tirosh"
bootstrap_script = "/mnt/tirosh/deploy/bootstrap.sh"

[guest.docker_images]
platform = "linux/arm64"
bundle_path = ".tmp/vitalserver-vm-pkg/docker-images/vitalserver-images.tar.gz"
optional_bundle_path = ".tmp/vitalserver-vm-pkg/optional-docker-images/vitalserver-optional-images.tar.gz"
app_dockerfile = "apps/vitalserver/docker/Dockerfile"
audit_proxy_image = "vitalserver-audit-proxy:0.1.0"
audit_proxy_dockerfile = "apps/vitalserver-audit-proxy/Dockerfile"
vitaldb_observer_image = "vitaldb-observer:0.1.0"
vitaldb_observer_dockerfile = "apps/vitaldb-observer/Dockerfile"
redis_relay_image = "vitalserver-redis-relay:0.1.0"
redis_relay_dockerfile = "apps/vitalserver-redis-relay/Dockerfile"
testkit_image = "vitalserver-testkit:0.1.1"
testkit_dockerfile = "packages/vitalserver-testkit/Dockerfile"
images = [
  "vitalserver:2.3.4",
  "vitalserver-audit-proxy:0.1.0",
  "vitaldb-observer:0.1.0",
  "vitalserver-redis-relay:0.1.0",
  "redis:3.2.12-alpine",
  "ghcr.io/joeferner/redis-commander:0.9.0",
  "swaggerapi/swagger-ui:v5.17.14",
  "nginx:1.24-alpine",
]
optional_images = [
  "vitalserver-testkit:0.1.1",
]

[guest.deploy]
docker_image_bundle_destination = "docker-images/vitalserver-images.tar.gz"
optional_docker_image_bundle_destination = "optional-docker-images/vitalserver-optional-images.tar.gz"
python_wheel_destination = "python-wheels"
python_wheel_projects = [
  "packages/vitalserver-guest-tools",
]
include = [
  "apps/vitalserver/docker",
  "apps/vitalserver/runtime",
  "apps/vitalserver-audit-proxy",
  "apps/vitaldb-observer",
  "apps/vitalserver-redis-relay",
  "packages/vitalserver-testkit",
  "vendor/vitalserver/vitalserver-old",
  { source = "docs/api/vitalserver.openapi.yaml", destination = "docs/openapi.yaml" },
  { source = "docs/api/audit-proxy.openapi.yaml", destination = "docs/openapi/audit-proxy.openapi.yaml" },
  { source = "docs/api/vitaldb-observer.openapi.yaml", destination = "docs/openapi/vitaldb-observer.openapi.yaml" },
  { source = "docs/runtime/macos/runtime-control.openapi.json", destination = "docs/macos-runtime/runtime-control.openapi.json" },
]
