# Build-machine settings for local VM artifact preparation.
# This file is not installed as product runtime config.

[workspace]
macos_runtime_source_dir = "apps/vitalserver-macos-runtime"
build_dir = ".tmp/vitalserver-vm-pkg"
dist_dir = "dist"
clang_module_cache = ".tmp/clang-module-cache"

[macos.app]
name = "VitalServer Helper"
helper_product_name = "VitalServerHelper"
runtime_cli_product_name = "vitalserver-vm"
bundle_dir = ".tmp/VitalServer Helper.app"

[macos.package]
identifier = "com.tirosh.vitalserver.vm"

# Filesystem contract for files laid down by the macOS installer.
[macos.install]
product_root = "/Library/Application Support/TiroshVitalServer"
applications_dir = "/Applications"
launch_daemons_dir = "/Library/LaunchDaemons"
vm_cli = "/usr/local/bin/vitalserver-vm"
proxy_runner = "/usr/local/bin/vitalserver-proxy-run"
uninstaller = "/usr/local/bin/tirosh-vitalserver-uninstall"
install_settings_json = "/private/tmp/tirosh-vitalserver-install.json"
uninstall_log = "/private/tmp/tirosh-vitalserver-uninstall.log"
preserve_tmp_template = "/private/tmp/tirosh-vitalserver-preserve.XXXXXX"

[macos.package.outputs]
pkg_filename_template = "TiroshVitalServerVM-{releaseLabel}.pkg"
dmg_filename_template = "TiroshVitalServer-{releaseLabel}.dmg"
dmg_installer_pkg_name = "Install Tirosh VitalServer.pkg"
dmg_staging_dir = ".tmp/vitalserver-vm-dmg"

[macos.launchd.vm]
template_file = "com.tirosh.vitalserver-vm.plist.template"
installed_plist = "com.tirosh.vitalserver-vm.plist"

[macos.launchd.proxy]
template_file = "com.tirosh.vitalserver-proxy.plist.template"
installed_plist = "com.tirosh.vitalserver-proxy.plist"

[macos.launchd.watchdog]
template_file = "com.tirosh.vitalserver-watchdog.plist.template"
installed_plist = "com.tirosh.vitalserver-watchdog.plist"

[macos.host_proxy.nginx]
binary_path = ".artifacts/nginx/macos/bin/nginx"
expected_version = "nginx/1.31.0"
non_system_dylib_prefixes = ["/opt/", "/usr/local/"]

[guest.ubuntu]
release = "noble"
version = "24.04"
base_url = "https://cloud-images.ubuntu.com/releases/noble/release"
arch = "auto"
kernel_suffix = "vmlinuz-generic"
initrd_suffix = "initrd-generic"

[guest.runtime]
disk_image_name = "vm-disk.img"
rootfs_size = "4G"
runtime_dir = "~/.tirosh/vitalserver-vm/runtime"

[guest.cloud_init]
seed_directory_name = "cloud-init-seed"
seed_iso_name = "seed.iso"
hostname = "tirosh-vitalserver"
username = "ubuntu"
password = "ubuntu"
ssh_key_path = "~/.ssh/id_ed25519.pub"
run_bootstrap = true
share_tag = "tirosh"
share_mount = "/mnt/tirosh"
bootstrap_script = "/mnt/tirosh/deploy/bootstrap.sh"

[guest.docker_images]
platform = "linux/arm64"
bundle_path = ".tmp/vitalserver-vm-pkg/docker-images/vitalserver-images.tar.gz"
app_dockerfile = "apps/vitalserver/docker/Dockerfile"
audit_proxy_image = "vitalserver-audit-proxy:0.1.0"
audit_proxy_dockerfile = "apps/vitalserver-audit-proxy/Dockerfile"
vitaldb_observer_image = "vitaldb-observer:0.1.0"
vitaldb_observer_dockerfile = "apps/vitaldb-observer/Dockerfile"
images = [
  "vitalserver:2.3.4",
  "vitalserver-audit-proxy:0.1.0",
  "vitaldb-observer:0.1.0",
  "redis:3.2.12-alpine",
  "ghcr.io/joeferner/redis-commander:0.9.0",
  "swaggerapi/swagger-ui:v5.17.14",
  "nginx:1.24-alpine",
]

[guest.deploy]
docker_image_bundle_destination = "docker-images/vitalserver-images.tar.gz"
include = [
  "apps/vitalserver/docker",
  "apps/vitalserver/runtime",
  "apps/vitalserver-audit-proxy",
  "apps/vitaldb-observer",
  "vendor/vitalserver/vitalserver-old",
  "docs/openapi.yaml",
  "docs/openapi/audit-proxy.openapi.yaml",
  "docs/openapi/vitaldb-observer.openapi.yaml",
  "docs/macos-runtime/runtime-control.openapi.json",
]
