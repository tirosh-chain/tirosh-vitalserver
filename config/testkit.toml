# VitalServer productization check defaults.
#
# 기본 scenario는 smoke로 두되, recorder 수와 load/stream 설정은 제품화 검증에
# 의미 있는 수준으로 둔다. `make testkit-load`는 recorders * repeat 만큼
# send_data event를 보낸다. `make testkit-stream`은 recorders 개수만큼
# persistent Socket.IO connection을 유지하고 Ctrl+C 전까지 계속 전송한다.

[scenario]
name = "smoke"

[server]
base_url = "http://localhost"
timeout = 60
wait_seconds = 60
poll_interval_seconds = 1

[sessions]
state_path = "/var/lib/vitalserver-testkit/sessions.json"

[bed_registry]
# TestKit API registry for explicitly created bed identities.
# This is separate from product VitalDB bed observations and from the runner's
# [beds] generation defaults below.
state_path = "/var/lib/vitalserver-testkit/bed-registry.json"

[logging]
version = 1
disable_existing_loggers = false

[logging.formatters.testkit]
"()" = "tirosh_vitalserver.testkit.observability.TestKitEventFormatter"
format_name = "json"

[logging.handlers.stdout]
class = "logging.StreamHandler"
formatter = "testkit"
stream = "ext://sys.stdout"

[logging.loggers."tirosh_vitalserver.testkit"]
handlers = ["stdout"]
level = "INFO"
propagate = false

[beds]
# payload를 비워두면 runner가 이 설정으로 test bed identity를 먼저 만든 뒤
# 해당 room name을 recorder command에 명시적으로 전달한다.
count = 5
prefix = "testkit-bed"
admin_user_id = "admin"

[recorder]
# 실제 장비 payload를 재현해야 할 때만 아래처럼 지정한다.
# payload = "path/to/recorder-payload.json"
recorders = 5
default_scenario = "normal"

[[recorder.bed_scenarios]]
index = 2
scenario = "tachycardia"

[[recorder.bed_scenarios]]
index = 4
scenario = "desaturation"

[transfer]
concurrency = 10
repeat = 100
max_failure_rate = 0

[stream]
interval_seconds = 1
duration_seconds = 0
