x-socket-io-events:
  namespace: /
  note: |
    Socket.IO events are not representable as normal OpenAPI paths. They are
    listed here because this upstream VitalServer receives real-time monitor
    payloads through Socket.IO, not through `POST /api/send`.
  client_to_server:
    - event: send_data
      description: |
        Vital Recorder sends compressed binary/string payloads. Server inflates
        with zlib, parses JSON, registers beds, stores recent data in Redis,
        and emits `recv_data` to bed rooms.
    - event: join_vr
      description: Join a Vital Recorder room and register client IP.
    - event: join_bed
      description: Join a bed room and receive recorder IP address.
    - event: leave_bed
      description: Leave a bed room.
    - event: send_vrconf
      description: Request recorder configuration.
    - event: req_folder_list
      description: Request file/folder listing.
    - event: req_json
      description: Request static device and filter metadata.
    - event: req_bed_status
      description: Request cached bed status.
    - event: req_prev_data
      description: Request recent cached monitor data.
    - event: req_cmd
      description: Send management command to recorder.
    - event: req_manage_config
      description: Update configuration through UI.
    - event: req_manage_user
      description: Manage users through UI.
    - event: req_manage_hl7
      description: Manage HL7 mappings through UI.
    - event: req_change_password
      description: Change account password.
    - event: upgrade_all_vr
      description: Broadcast recorder update command.
  server_to_client:
    - event: dt
    - event: recv_data
    - event: recv_filter
    - event: recv_vr_ipaddr
    - event: recv_vrs_ipaddr
    - event: recv_vrconf
    - event: res_folder_list
    - event: res_json
    - event: res_bed_status
    - event: res_prev_data
    - event: res_cmd
    - event: res_manage
    - event: res_manage_config
    - event: res_manage_account
    - event: res_change_password
