openapi: 3.1.0
info:
  title: VitalDB Observer API
  version: 0.1.0
  description: Local stateless collector API for VitalDB recorder, bed, proxy, and anomaly observations.
servers:
  - url: http://127.0.0.1:18083
paths:
  /health:
    get:
      operationId: getObserverHealth
      summary: Process liveness
      responses:
        "200":
          description: Observer process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /ready:
    get:
      operationId: getObserverReadiness
      summary: Redis readiness
      responses:
        "200":
          description: Observer can read Redis.
          content:
            application/json:
              schema:
                type: object
                required: [ready, observedAt]
                properties:
                  ready:
                    type: boolean
                  observedAt:
                    type: string
        "503":
          description: Observer cannot read Redis.
  /api/v1/observations:
    get:
      operationId: getVitalDBObservations
      summary: Latest VitalDB observation snapshot
      responses:
        "200":
          description: Latest computed observation snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalDBObservationDocument"
        "503":
          description: Snapshot collection failed. Response body preserves the observation shape with ready=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalDBObservationDocument"
  /api/v1/redis/snapshots:
    get:
      operationId: getVitalDBRedisSnapshotPage
      summary: Allowlisted Redis snapshot page for external read-only relay
      description: >
        Returns one SCAN page of allowlisted VitalServer Redis keys with TYPE,
        PTTL, and Redis DUMP payload encoded as base64. This endpoint is disabled
        by default and requires a bearer token when enabled.
      security:
        - snapshotBearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            default: "0"
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
      responses:
        "200":
          description: One allowlisted Redis snapshot page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VitalDBRedisSnapshotPage"
        "400":
          description: Invalid query parameter.
        "401":
          description: Missing or invalid bearer token.
        "503":
          description: Snapshot export is disabled, misconfigured, or Redis read failed.
components:
  securitySchemes:
    snapshotBearerAuth:
      type: http
      scheme: bearer
  schemas:
    VitalDBRedisSnapshotPage:
      type: object
      required:
        - schemaVersion
        - source
        - observedAt
        - cursor
        - nextCursor
        - complete
        - scanCount
        - limit
        - scanned
        - copied
        - skipped
        - keys
        - readIssues
      properties:
        schemaVersion:
          type: integer
        source:
          type: string
        observedAt:
          type: string
        cursor:
          type: string
        nextCursor:
          type: string
        complete:
          type: boolean
        scanCount:
          type: integer
        limit:
          type: integer
        scanned:
          type: integer
        copied:
          type: integer
        skipped:
          type: integer
        keys:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBRedisSnapshotKey"
        readIssues:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBRedisSnapshotReadIssue"
    VitalDBRedisSnapshotKey:
      type: object
      required:
        - key
        - keyType
        - ttlMs
        - dumpBase64
      properties:
        key:
          type: string
        keyType:
          type: string
          enum: [string, list, set, zset, hash, stream, none]
        ttlMs:
          type: integer
        dumpBase64:
          type: string
          contentEncoding: base64
    VitalDBRedisSnapshotReadIssue:
      type: object
      required:
        - key
        - message
      properties:
        key:
          type: [string, "null"]
        message:
          type: string
    VitalDBObservationDocument:
      type: object
      required:
        - schemaVersion
        - source
        - observedAt
        - ready
        - recorderOnlineThresholdSeconds
        - recorders
        - beds
        - devices
        - filters
        - proxyConnections
        - anomalies
        - readIssues
      properties:
        schemaVersion:
          type: integer
        source:
          type: string
        observedAt:
          type: string
        ready:
          type: boolean
        recorderOnlineThresholdSeconds:
          type: integer
        recorders:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBRecorderObservation"
        beds:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBBedObservation"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBRawBedScopedObservation"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBRawBedScopedObservation"
        proxyConnections:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBProxyConnectionObservation"
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBAnomalyObservation"
        readIssues:
          type: array
          items:
            $ref: "#/components/schemas/VitalDBObservationReadIssue"
    VitalDBObservationReadIssue:
      type: object
      required:
        - source
        - message
      properties:
        source:
          type: string
        message:
          type: string
    VitalDBRecorderObservation:
      type: object
      properties:
        vrcode:
          type: string
        ip:
          type: [string, "null"]
        lastSeenAt:
          type: [string, "null"]
        version:
          type: [string, "null"]
        info:
          type: [string, "null"]
        config:
          type: [string, "null"]
        online:
          type: boolean
        stale:
          type: boolean
        activity:
          anyOf:
            - $ref: "#/components/schemas/VitalDBRecorderActivityObservation"
            - type: "null"
    VitalDBRecorderActivityObservation:
      type: object
      description: Recent VRecorder send_data activity summarized from the audit proxy Redis list.
      properties:
        windowSeconds:
          type: integer
          minimum: 1
        messageCount:
          type: integer
          minimum: 0
        byteCount:
          type: integer
          minimum: 0
        roomCount:
          type: integer
          minimum: 0
        firstSeenAt:
          type: [string, "null"]
        lastSeenAt:
          type: [string, "null"]
        messagesPerSecond:
          type: number
          minimum: 0
        bytesPerSecond:
          type: number
          minimum: 0
    VitalDBBedObservation:
      type: object
      properties:
        bedID:
          type: string
        name:
          type: [string, "null"]
        vrcode:
          type: [string, "null"]
        lastSeenAt:
          type: [string, "null"]
        patientConnected:
          type: [boolean, "null"]
        online:
          type: boolean
    VitalDBRawBedScopedObservation:
      type: object
      properties:
        bedID:
          type: string
        rawValue:
          type: string
    VitalDBProxyConnectionObservation:
      type: object
      properties:
        observedAt:
          type: string
        remoteAddress:
          type: [string, "null"]
        remotePort:
          type: [string, "null"]
        requestURI:
          type: [string, "null"]
        status:
          type: [string, "null"]
        upstreamStatus:
          type: [string, "null"]
        upstreamResponseTime:
          type: [string, "null"]
        websocketHandshake:
          type: boolean
    VitalDBAnomalyObservation:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [offline, duplicate-ip, backend-unavailable, stale-recorder, observer-unhealthy]
        severity:
          type: string
          enum: [info, warning, critical]
        observedAt:
          type: string
        subject:
          type: string
        message:
          type: string
