          type: integer
          description: Current adaptive replay concurrency limit for upstream send_data attempts.
          minimum: 0
        lastDecision:
          type: string
        lastReason:
          type: string
        lastChangedAt:
          type: string
          nullable: true
        memoryGuardStatus:
          type: string
          description: Memory guard state reported by explicit providers. Use unavailable when no explicit provider has supplied memory guard input.
          enum:
            - healthy
            - warm
            - hot
            - critical
            - missing
            - stale
            - invalid
            - failed
            - unavailable
            - disabled
    RecorderSpoolStatus:
      type: object
      additionalProperties: false
      required:
        - acceptedEvents
        - spooledEvents
        - rejectedEvents
        - writeFailures
        - pendingItems
        - pendingBytes
        - oldestPendingAgeSeconds
        - lastAcceptedAt
        - lastSpooledAt
        - lastFailure
      properties:
        acceptedEvents:
          type: integer
          minimum: 0
        spooledEvents:
          type: integer
          minimum: 0
        rejectedEvents:
          type: integer
          minimum: 0
        writeFailures:
          type: integer
          minimum: 0
        pendingItems:
          type: integer
          minimum: 0
        pendingBytes:
          type: integer
          minimum: 0
        oldestPendingAgeSeconds:
          type: integer
          minimum: 0
          nullable: true
        lastAcceptedAt:
          type: string
          nullable: true
        lastSpooledAt:
          type: string
          nullable: true
        lastFailure:
          $ref: "#/components/schemas/RecorderIngressFailure"
    RecorderReplayStatus:
      type: object
      additionalProperties: false
      required:
        - pendingItems
        - inFlightItems
        - replayedEvents
        - retryableFailures
        - deadLetteredEvents
        - replayLagSeconds
        - lastReplayAt
        - lastFailure
      properties:
        pendingItems:
          type: integer
          minimum: 0
        inFlightItems:
          type: integer
          minimum: 0
        replayedEvents:
          type: integer
          minimum: 0
        retryableFailures:
          type: integer
          minimum: 0
        deadLetteredEvents:
          type: integer
          minimum: 0
        replayLagSeconds:
          type: integer
          minimum: 0
          nullable: true
        lastReplayAt:
          type: string
          nullable: true
        lastFailure:
          $ref: "#/components/schemas/RecorderIngressFailure"
    SendDataIngressMode:
      type: string
      description: |
        Explicit send_data delivery policy. observe_only preserves direct upstream
        delivery, records audit/metrics and bounded raw archive evidence without
        appending Redis replay pending, and keeps replay disabled. In 0.2.1,
        spool_and_replay is degraded because frame suppression is not guarded by
        a Recorder-visible durable admission acknowledgement.
      enum:
        - passthrough
        - observe_only
        - mirror_spool
        - spool_only
        - spool_and_replay
    RecorderIngressSpoolStatusValue:
      type: string
      enum:
        - unavailable
        - disabled
        - ready
        - degraded
        - failed
    RecorderIngressReplayStatusValue:
      type: string
      enum:
        - unavailable
        - disabled
        - idle
        - replaying
        - degraded
        - failed
    RecorderIngressFailure:
      type: object
      nullable: true
      additionalProperties: false
      required:
        - reason
        - message
        - occurredAt
      properties:
        reason:
          type: string
          enum:
            - invalid_payload
            - spool_unavailable
            - spool_full
            - raw_archive_unavailable
            - raw_archive_write_failed
            - spool_write_failed
            - upstream_unavailable
            - upstream_timeout
            - upstream_rejected
            - replay_session_unavailable
        message:
          type: string
        occurredAt:
          type: string
          nullable: true
