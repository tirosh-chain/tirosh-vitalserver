openapi: 3.0.3
info:
  title: VitalServer Audit Proxy API
  version: 0.1.0
  description: Operational endpoints exposed by the VitalServer audit proxy sidecar.
servers:
  - url: /
paths:
  /audit-proxy/health:
    get:
      operationId: getAuditProxyHealth
      summary: Check audit proxy liveness
      description: Returns 204 when the audit proxy process can serve local health checks.
      responses:
        "204":
          description: Audit proxy is alive.
  /audit-proxy/status:
    get:
      operationId: getAuditProxyStatus
      summary: Read audit proxy counters
      description: Returns in-memory counters for proxy traffic, Socket.IO parsing, and audit sink failures.
      responses:
        "200":
          description: Audit proxy status counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditProxyStatus"
components:
  schemas:
    AuditProxyStatus:
      type: object
      additionalProperties: false
      required:
        - startedAt
        - uptimeSeconds
        - activeWebSockets
        - activeRecorderConnections
        - recorders
        - httpRequests
        - socketIoEventsSeen
        - sendDataEventsObserved
        - sendDataBytesObserved
        - lastSendDataObservedAt
        - socketIoParseFailures
        - auditWriteFailures
        - auditFileWriteFailures
        - auditStdoutWriteFailures
        - redisIpWriteFailures
        - redisIpVerifyFailures
        - redisIpVerifyMismatches
      properties:
        startedAt:
          type: string
          description: Audit proxy process start timestamp.
        uptimeSeconds:
          type: integer
          minimum: 0
        activeWebSockets:
          type: integer
          minimum: 0
        activeRecorderConnections:
          type: integer
          minimum: 0
        recorders:
          type: array
          items:
            $ref: "#/components/schemas/RecorderConnection"
        httpRequests:
          type: integer
          minimum: 0
        socketIoEventsSeen:
          type: integer
          minimum: 0
        sendDataEventsObserved:
          type: integer
          minimum: 0
          description: Number of client send_data events observed by the audit proxy.
        sendDataBytesObserved:
          type: integer
          minimum: 0
          description: Total compressed send_data payload bytes observed by the audit proxy.
        lastSendDataObservedAt:
          type: string
          nullable: true
          description: Last timestamp at which the audit proxy observed a client send_data payload.
        socketIoParseFailures:
          type: integer
          minimum: 0
        auditWriteFailures:
          type: integer
          minimum: 0
        auditFileWriteFailures:
          type: integer
          minimum: 0
        auditStdoutWriteFailures:
          type: integer
          minimum: 0
        redisIpWriteFailures:
          type: integer
          minimum: 0
        redisIpVerifyFailures:
          type: integer
          minimum: 0
        redisIpVerifyMismatches:
          type: integer
          minimum: 0
    RecorderConnection:
      type: object
      additionalProperties: false
      required:
        - vrcode
        - activeConnections
      properties:
        vrcode:
          type: string
        activeConnections:
          type: integer
          minimum: 0
        selectedIp:
          type: string
          nullable: true
        ipSource:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          nullable: true
        sendDataEventsObserved:
          type: integer
          minimum: 0
        sendDataBytesObserved:
          type: integer
          minimum: 0
        lastSendDataObservedAt:
          type: string
          nullable: true
        redisIpSync:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RecorderRedisIPSync"
    RecorderRedisIPSync:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        redisKey:
          type: string
        selectedIp:
          type: string
        ipSource:
          type: string
        redisValue:
          type: string
          nullable: true
        lastWriteAt:
          type: string
          nullable: true
        lastVerifiedAt:
          type: string
          nullable: true
        lastFailure:
          type: string
          nullable: true
