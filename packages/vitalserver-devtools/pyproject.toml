[project]
name = "tirosh-vitalserver-devtools"
version = "0.2.0"
description = "Build-machine tooling for VitalServer VM artifacts."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0",
]

[project.scripts]
vitalserver-devtools = "tirosh_vitalserver.devtools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirosh_vitalserver"]
