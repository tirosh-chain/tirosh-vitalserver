[project]
name = "tirosh-vitalserver-vm-build"
version = "0.1.0"
description = "Build-machine tooling for VitalServer VM artifacts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vitalserver-vm-build = "tirosh_vitalserver.vm_build.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirosh_vitalserver"]
