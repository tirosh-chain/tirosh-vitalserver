[project]
name = "tirosh-vitalserver-testkit"
version = "0.1.0"
description = "Validation and transfer helpers for productionizing VitalServer."
requires-python = ">=3.14.0,!=3.14.0b3"
dependencies = [
  "pydantic>=2.12,<3",
  "python-socketio[client]>=4.6,<5",
]

[project.scripts]
vitalserver-testkit = "tirosh_vitalserver.testkit.adapters.inbound.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirosh_vitalserver"]
