[project]
name = "tirosh-vitalserver-testkit"
version = "0.1.1"
description = "Validation and transfer helpers for productionizing VitalServer."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "python-socketio[client]>=4.6,<5",
  "uvicorn>=0.32,<1",
]

[project.scripts]
vitalserver-testkit = "tirosh_vitalserver.testkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirosh_vitalserver"]
