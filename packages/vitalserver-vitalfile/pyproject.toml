[project]
name = "tirosh-vitalserver-vitalfile"
version = "0.1.0"
description = "Versioned Vital File readers and writers for VitalServer products."
requires-python = ">=3.12"
dependencies = [
  "tirosh-vitalserver-core",
  "vitaldb>=1.7,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirosh_vitalserver"]
